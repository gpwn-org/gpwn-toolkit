[workspace]
resolver = "2"
members = [
    "crates/gpwn-core",
    "crates/gpwn-scan",
    "crates/gpwn-ssh",
    "crates/gpwn-mock",
    "crates/gpwn-capture",
    "crates/gpwn-pcap-analyzer",
    "crates/gpwn-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Rithwik Jayasimha (@thel3l)", "Rithvik Vibhu (@rithvikvibhu)"]
license = "GPL-3.0-only"
repository = "https://github.com/gpwn-org/gpwn-toolkit"
homepage = "https://github.com/thel3l/gpwn/tree/main/gpwn-toolkit"
readme = "README.md"

[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "process",
    "io-util",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["signal", "fs"] }

[profile.release]
strip = true
lto = "thin"
