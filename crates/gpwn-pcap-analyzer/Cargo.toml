[package]
name = "gpwn-pcap-analyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/gpwn-pcap-analyzer"
readme.workspace = true
description = "Streaming PCAP/PCAPNG analyzer and local API for GPWN Signal Map"
keywords = ["pcap", "tshark", "network-analysis", "gpon"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = { version = "0.7", features = ["io"] }
